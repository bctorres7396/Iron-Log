<!DOCTYPE html>
<html lang="en" class="preload">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#0a0a0a">
<title>Iron Log</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiSXJvbiBMb2ciLCJzaG9ydF9uYW1lIjoiSXJvbkxvZyIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGEwYTBhIiwidGhlbWVfY29sb3IiOiIjMGEwYTBhIn0=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --accent: #e63946;
    --accent-dim: #b82d38;
    --accent-glow: rgba(230, 57, 70, 0.15);
    --text: #f1f1f1;
    --text-dim: #888;
    --text-muted: #555;
    --success: #2ec486;
    --warning: #f4a261;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --theme-transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  [data-theme="light"] {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #e0e0e0;
    --accent: #d32f2f;
    --accent-dim: #b71c1c;
    --accent-glow: rgba(211, 47, 47, 0.08);
    --text: #1a1a1a;
    --text-dim: #666;
    --text-muted: #999;
    --success: #1a9e5e;
    --warning: #e07b39;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    transition: var(--theme-transition);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: calc(20px + var(--safe-bottom));
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ── Header ── */
  .header {
    padding: calc(16px + var(--safe-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .logo {
    font-family: 'Oswald', 'JetBrains Mono', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon { color: var(--accent); font-size: 18px; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    width: 38px;
    height: 38px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: transform 0.1s;
  }
  .add-btn:active { transform: scale(0.92); }

  /* ── Nav ── */
  .nav { display: flex; gap: 4px; margin-top: 14px; }
  .nav-btn {
    flex: 1;
    padding: 10px 0;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .nav-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ── Section ── */
  .section { padding: 20px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 12px;
  }

  /* ── Exercise Item ── */
  .exercise-item {
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .exercise-item:active { background: var(--accent-glow); border-color: var(--accent); }
  .exercise-name { font-size: 15px; font-weight: 700; }
  .exercise-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .exercise-pr { margin-left: 8px; color: var(--accent); }
  .trend-up { color: var(--success); }
  .trend-down { color: var(--warning); }
  .trend-flat { color: var(--text-muted); }
  .chevron { color: var(--text-muted); font-size: 18px; }

  /* ── Inputs ── */
  .input, .number-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .input:focus, .number-input:focus { border-color: var(--accent); }
  .number-input {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    padding: 14px;
  }

  /* ── Labels ── */
  .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: block;
  }

  /* ── Buttons ── */
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary:active { transform: scale(0.97); background: var(--accent-dim); }
  .btn-secondary {
    padding: 8px 16px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-danger {
    padding: 6px 12px;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(230, 57, 70, 0.2);
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  /* ── PR Card ── */
  .pr-card {
    background: var(--accent-glow);
    border-color: rgba(230, 57, 70, 0.27);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pr-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .pr-value { font-size: 26px; font-weight: 800; }
  .pr-unit { font-size: 14px; color: var(--text-dim); }

  /* ── History Set ── */
  .history-set {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .set-weight { font-weight: 700; font-size: 16px; }
  .set-unit { font-size: 11px; color: var(--text-dim); }
  .set-x { margin: 0 8px; color: var(--text-muted); }
  .set-vol { margin-left: 12px; font-size: 11px; color: var(--text-muted); }
  .set-time { font-size: 10px; color: var(--text-muted); }
  .set-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    font-family: inherit;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
    animation: fadeIn 0.15s ease-out;
  }
  .modal-content {
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: 24px;
    padding-bottom: calc(24px + var(--safe-bottom));
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-bottom: none;
    animation: slideUp 0.2s ease-out;
  }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .modal-row { display: flex; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }

  /* ── Rest Timer ── */
  .timer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    animation: fadeIn 0.2s ease-out;
  }
  .timer-status {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    transition: color 0.3s;
  }
  .timer-status.done { color: var(--success); }
  .timer-circle { position: relative; width: 190px; height: 190px; margin-bottom: 32px; }
  .timer-circle svg { transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: var(--border); stroke-width: 6; }
  .timer-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  .timer-progress.done { stroke: var(--success); }
  .timer-display {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .timer-digits {
    font-size: 48px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    transition: color 0.3s;
  }
  .timer-digits.done { color: var(--success); }
  .timer-toggles { display: flex; gap: 8px; margin-bottom: 32px; }
  .timer-toggle {
    padding: 10px 28px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .timer-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .timer-toggle.active.done { background: var(--success); border-color: var(--success); }
  .timer-dismiss {
    padding: 14px 52px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    transition: all 0.3s;
  }
  .timer-dismiss.done { background: var(--success); color: #fff; border-color: var(--success); }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .stat-card { text-align: center; padding: 14px; }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }
  .stats-subtitle { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--text-dim); }
  .pr-row { display: flex; justify-content: space-between; align-items: center; }
  .pr-row-name { font-weight: 700; font-size: 14px; }
  .pr-row-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .pr-row-value { font-weight: 800; font-size: 18px; color: var(--accent); }
  .pr-row-vol { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-align: right; }

  /* ── Empty State ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--text-dim); }
  .empty-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ── Misc ── */
  .flex-center { display: flex; align-items: center; gap: 8px; }
  .date-header { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .delete-zone { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }
  .hidden { display: none; }
  .preload * { transition: none !important; }

  /* ── Theme Transitions ── */
  .header, .card, .exercise-item, .modal-content, .input, .number-input,
  .btn-primary, .btn-secondary, .btn-danger, .nav-btn, .timer-overlay,
  .timer-toggle, .timer-dismiss, .stat-card, .history-set, .pr-card {
    transition: var(--theme-transition);
  }

  /* ── Theme Toggle ── */
  .theme-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: var(--theme-transition), transform 0.1s;
    margin-right: 8px;
  }
  .theme-toggle:active { transform: scale(0.92); }

  /* ── Drag Handle (Bottom Sheet) ── */
  .drag-handle {
    width: 36px;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    margin: 0 auto 16px;
    opacity: 0.6;
  }

  /* ── Progress Bar ── */
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-fill.warn { background: var(--warning); }
  .progress-fill.good { background: var(--success); }

  /* ── Skeleton Loading ── */
  @keyframes shimmer {
    0% { background-position: -300px 0; }
    100% { background-position: calc(300px + 100%) 0; }
  }
  .skeleton-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }
  .skeleton-screen.fade-out { opacity: 0; pointer-events: none; }
  .skeleton-block {
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 300px 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .skeleton-block.header { width: 90%; max-width: 400px; height: 44px; }
  .skeleton-block.item { width: 90%; max-width: 400px; height: 60px; }
  .skeleton-block.item-short { width: 70%; max-width: 320px; height: 60px; }

  /* ── Plate Calculator ── */
  .plate-calc { margin-top: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .plate-calc-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .plate-calc-bar { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .plate-calc-side { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
  .plate-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .plate-chip { display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; }
  .plate-chip._45 { background: #e63946; } .plate-chip._35 { background: #f4a261; } .plate-chip._25 { background: #2a9d8f; } .plate-chip._10 { background: #457b9d; } .plate-chip._5 { background: #6c757d; } .plate-chip._2-5 { background: #8d99ae; color: #1a1a1a; }
  .plate-calc-note { font-size: 9px; color: var(--warning); margin-top: 6px; }

  /* ── Sync Indicator ── */
  .sync-dot {
    width: 10px; height: 10px; border-radius: 50%; margin-right: 10px;
    transition: background-color 0.3s;
    flex-shrink: 0;
  }
  .sync-dot.online { background: #2ec486; box-shadow: 0 0 6px rgba(46, 196, 134, 0.5); }
  .sync-dot.syncing { background: #f4a261; box-shadow: 0 0 6px rgba(244, 162, 97, 0.5); animation: pulse 1s infinite; }
  .sync-dot.offline { background: #e63946; box-shadow: 0 0 6px rgba(230, 57, 70, 0.5); }
  .sync-dot.unconfigured { background: #555; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .sync-banner {
    padding: 6px 14px; font-size: 10px; font-weight: 600; text-align: center;
    letter-spacing: 0.5px; transition: all 0.3s;
  }
  .sync-banner.offline { background: #e63946; color: #fff; }
  .sync-banner.online { background: #2ec486; color: #fff; }

  /* ── Export Buttons ── */
  .export-section { margin-top: 24px; }
  .export-row { display: flex; gap: 10px; }
  .btn-export {
    flex: 1; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; letter-spacing: 0.5px; text-align: center;
    transition: all 0.15s; border: 1px solid var(--border); background: var(--surface);
    color: var(--text);
  }
  .btn-export:active { transform: scale(0.97); }
  .btn-export.csv { border-color: #2a9d8f; color: #2a9d8f; }
  .btn-export.pdf { border-color: var(--accent); color: var(--accent); }

  /* ── Set Rows (Workout multi-set logging) ── */
  .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .set-row .number-input { flex: 2; font-size: 18px; padding: 10px; }
  .set-row .number-input.set-reps { flex: 1.5; }
  .set-row-sep { color: var(--text-muted); font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .set-row-label {
    font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-muted); flex-shrink: 0; min-width: 18px; text-align: center;
  }
  .set-row-remove {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0; line-height: 1;
  }
  .set-row-remove:active { border-color: var(--accent); color: var(--accent); }

  /* ── Superset ── */
  .superset-badge {
    display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 4px; background: var(--accent-glow);
    color: var(--accent); border: 1px solid rgba(230, 57, 70, 0.25); margin-left: 6px;
  }
  .superset-section { margin: 16px 0; }
  .superset-row { display: flex; gap: 8px; align-items: center; }
  .superset-select {
    flex: 1; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; font-family: inherit; outline: none;
  }
  .superset-select:focus { border-color: var(--accent); }
  .superset-partner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--accent-glow); border: 1px solid rgba(230, 57, 70, 0.25);
    border-radius: 8px; font-size: 13px;
  }
  .superset-partner-name { font-weight: 700; }
  .superset-partner-label { font-size: 9px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .superset-unpair { font-size: 10px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: inherit; }
  .superset-note { font-size: 10px; color: var(--success); margin-top: 4px; }

  /* ── Split Setup Cards ── */
  .split-card {
    background: var(--surface); border: 2px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
  }
  .split-card.selected { border-color: var(--accent); background: var(--accent-glow); }
  .split-card:active { transform: scale(0.98); }
  .split-card-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .split-card-sub { font-size: 11px; color: var(--text-dim); }
  .split-card-exercises { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .split-card-exercise {
    font-size: 10px; padding: 3px 8px; border-radius: 4px; background: var(--border);
    color: var(--text-dim);
  }

  /* ── Day Filter Pills ── */
  .day-filter { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .day-filter-btn {

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
console.log('══════════════════════════════════════');
console.log('IronLog: script execution START');
console.log('IronLog: localStorage available =', !!window.localStorage);
console.log('IronLog: navigator.onLine =', navigator.onLine);
console.log('══════════════════════════════════════');

// ═══════════════════════════════════════════════════════════════
// FIREBASE CONFIG — replace with your own Firebase project settings
// ═══════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA06vD1bTexUSJCsC4mjY6V8XtWNFAdwos",
  authDomain: "iron-log-d7f8a.firebaseapp.com",
  projectId: "iron-log-d7f8a",
  storageBucket: "iron-log-d7f8a.firebasestorage.app",
  messagingSenderId: "412021303254",
  appId: "1:412021303254:web:0b83ada1ed9da67be22677"
};


const firebaseConfigured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
let db = null;

if (firebaseConfigured) {
  console.log('IronLog Firebase: config detected, initializing...');
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    console.log('IronLog Firebase: firestore initialized, enabling persistence...');
    db.enablePersistence({ synchronizeTabs: true }).then(function() {
      console.log('IronLog Firebase: offline persistence ENABLED');
    }).catch(function(err) {
      console.warn('IronLog Firebase: persistence failed —', err.code, err.message);
    });
  } catch(e) {
    console.error('IronLog Firebase: init FAILED —', e.message);
  }
} else {
  console.log('IronLog Firebase: not configured (apiKey is placeholder) — localStorage only');
}

// ═══════════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'ironlog-data';
const SYNC_QUEUE_KEY = 'ironlog-sync-queue';
const USER_ID_KEY = 'ironlog-user-id';

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }

function getUserId() {
  let uid = localStorage.getItem(USER_ID_KEY);
  if (!uid) { uid = genId(); localStorage.setItem(USER_ID_KEY, uid); }
  return uid;
}

function saveLocal(d) {
  try {
    const json = JSON.stringify(d);
    localStorage.setItem(STORAGE_KEY, json);
    const verify = localStorage.getItem(STORAGE_KEY);
    console.log('IronLog saveLocal:', d.exercises.length + ' exercises,', d.history.length + ' sets,', (d.supersets || []).length + ' supersets',
      verify ? 'VERIFIED' : 'VERIFY-FAILED');
    if (!verify) console.error('IronLog: localStorage write verification failed — data may not persist');
  } catch(e) {
    console.error('IronLog: saveLocal EXCEPTION —', e.message, '(quota may be exceeded)');
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    console.log('IronLog loadData: raw length =', raw ? raw.length : 0);
    if (!raw) {
      console.log('IronLog loadData: no data in localStorage, returning defaults');
      return { exercises: [], history: [], supersets: [], bodyMetrics: [] };
    }
    const d = JSON.parse(raw);
    console.log('IronLog loadData: parsed', d.exercises?.length || 0, 'exercises,', d.history?.length || 0, 'sets,', d.supersets?.length || 0, 'supersets');
    let changed = false;
    (d.history || []).forEach(e => {
      if (!e.id) { e.id = genId(); changed = true; }
    });
    if (!d.supersets) { d.supersets = []; changed = true; }
    if (!d.exercises) { d.exercises = []; changed = true; }
    if (!d.history) { d.history = []; changed = true; }
    if (!d.bodyMetrics) { d.bodyMetrics = []; changed = true; }
    if (changed) saveLocal(d);
    return d;
  } catch(e) {
    console.error('IronLog loadData: EXCEPTION —', e.message, '(data corrupted, starting fresh)');
    return { exercises: [], history: [], supersets: [], bodyMetrics: [] };
  }
}

let data = loadData();
let currentTab = 'workout';
let currentExercise = null;
let pendingConfirm = null;
let syncInFlight = false;
let supersetJustLogged = null;
let editingEntryIndex = -1;
let activeDay = null;

const DAY_EXERCISES = {
  'Upper A': ['Bench Press', 'Barbell Row', 'Incline Dumbbell Press', 'Seated Cable Row', 'Lateral Raise', 'Tricep Pushdown', 'Barbell Curl'],
  'Upper B': ['Overhead Press', 'Pull Ups', 'Dumbbell Shoulder Press', 'Lat Pulldown', 'Face Pull', 'Skull Crushers', 'Hammer Curl'],
  'Lower A': ['Squat', 'Leg Press', 'Romanian Deadlift', 'Leg Curl', 'Leg Extension', 'Calf Raise'],
  'Lower B': ['Deadlift', 'Bulgarian Split Squat', 'Hip Thrust', 'Leg Curl', 'Leg Extension', 'Calf Raise']
};

// ═══════════════════════════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════════════════════════
function updateSyncDot(state) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + state;
  const titles = {
    online: 'Online — data synced to cloud',
    syncing: 'Syncing...',
    offline: 'Offline — changes saved locally',
    unconfigured: 'Firebase not configured — local only'
  };
  dot.title = titles[state] || '';
}

function saveData(d) {
  console.log('IronLog saveData:', d.exercises.length + ' exercises,', d.history.length + ' sets,', (d.supersets || []).length + ' supersets',
    'firebase=' + firebaseConfigured, 'online=' + navigator.onLine, 'syncBusy=' + syncInFlight);
  saveLocal(d);
  if (!firebaseConfigured) return;
  if (syncInFlight || !navigator.onLine) {
    console.log('IronLog saveData: cannot push right now, enqueuing');
    enqueueSync();
    return;
  }
  pushToCloud(d).then(() => drainSyncQueue());
}

async function pushToCloud(d) {
  if (!db) return;
  syncInFlight = true;
  updateSyncDot('syncing');
  try {
    const doc = { exercises: d.exercises, history: d.history, supersets: d.supersets || [], bodyMetrics: d.bodyMetrics || [], lastModified: new Date().toISOString() };
    await db.collection('workoutData').doc(getUserId()).set(doc);
    updateSyncDot('online');
  } catch(e) {
    updateSyncDot('offline');
    enqueueSync();
    console.warn('IronLog: pushToCloud failed —', e.message);
  } finally {
    syncInFlight = false;
  }
}

async function pullFromCloud() {
  if (!db) return null;
  try {
    const snap = await db.collection('workoutData').doc(getUserId()).get();
    return snap.exists ? snap.data() : null;
  } catch { return null; }
}

async function doFullSync() {
  if (!firebaseConfigured || !navigator.onLine || !db) return;
  updateSyncDot('syncing');
  try {
    const remote = await pullFromCloud();
    // Reload local NOW (after async pull) to capture any changes the user
    // made during the network request — otherwise we overwrite them
    const local = loadData();

    if (!remote) {
      await pushToCloud(local);
      updateSyncDot('online');
      return;
    }

    // Merge: union of exercises, deduplicate history by ID, keep newest per ID
    const mergedExercises = [...new Set([...local.exercises, ...(remote.exercises || [])])];

    // Ensure all entries have IDs, generate for any that don't
    [local.history, remote.history].forEach(arr => {
      if (arr) arr.forEach(e => { if (!e.id) e.id = genId(); });
    });

    const historyMap = {};
    (local.history || []).forEach(e => { historyMap[e.id] = e; });
    (remote.history || []).forEach(e => {
      if (!historyMap[e.id] || new Date(e.date) > new Date(historyMap[e.id].date)) {
        historyMap[e.id] = e;
      }
    });
    const mergedHistory = Object.values(historyMap).sort((a, b) => new Date(b.date) - new Date(a.date));

    // Union of supersets, deduplicate
    const localSS = local.supersets || [];
    const remoteSS = remote.supersets || [];
    const ssMap = new Map();
    localSS.forEach(p => { const k = [...p].sort().join('|'); if (!ssMap.has(k)) ssMap.set(k, p); });
    remoteSS.forEach(p => { const k = [...p].sort().join('|'); if (!ssMap.has(k)) ssMap.set(k, p); });
    const mergedSupersets = [...ssMap.values()];

    // Merge body metrics (union by ID)
    const bmMap = {};
    (local.bodyMetrics || []).forEach(e => { bmMap[e.id] = e; });
    (remote.bodyMetrics || []).forEach(e => {
      if (!bmMap[e.id] || new Date(e.date) > new Date(bmMap[e.id].date)) bmMap[e.id] = e;
    });
    const mergedBodyMetrics = Object.values(bmMap).sort((a, b) => new Date(b.date) - new Date(a.date));

    const merged = { exercises: mergedExercises, history: mergedHistory, supersets: mergedSupersets, bodyMetrics: mergedBodyMetrics };

    // Final safety net: reload local one last time and fold in any entries
    // that arrived between our first loadData and now
    const finalLocal = loadData();
    (finalLocal.history || []).forEach(e => {
      if (!merged.history.find(m => m.id === e.id)) merged.history.push(e);
    });
    finalLocal.exercises.forEach(e => {
      if (!merged.exercises.includes(e)) merged.exercises.push(e);
    });
    (finalLocal.supersets || []).forEach(p => {
      const k = [...p].sort().join('|');
      if (!merged.supersets.some(m => [...m].sort().join('|') === k)) merged.supersets.push(p);
    });
    (finalLocal.bodyMetrics || []).forEach(e => {
      if (!merged.bodyMetrics.find(m => m.id === e.id)) merged.bodyMetrics.push(e);
    });

    data = merged;
    saveLocal(merged);
    await pushToCloud(merged);
    updateSyncDot('online');

    // Rerender
    if (currentTab === 'workout') renderWorkout();
    else if (currentTab === 'history') renderHistory();
    else if (currentTab === 'progress') renderProgress();
    else if (currentTab === 'body') renderBody();
    else if (currentTab === 'stats') renderStats();
  } catch(e) {
    updateSyncDot('offline');
    console.warn('Full sync failed:', e);
  }
}

// ── Offline queue ──
function enqueueSync() {
  try {
    const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
    q.push(Date.now());
    if (q.length > 50) q.shift(); // cap queue size
    localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q));
  } catch {}
}

async function drainSyncQueue() {
  try {
    const q = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]');
    if (!q.length) return;
    await doFullSync();
    localStorage.setItem(SYNC_QUEUE_KEY, '[]');
  } catch {}
}

// ── Connectivity ──
function handleOnline() {
  updateSyncDot('syncing');
  drainSyncQueue().then(() => {
    if (currentTab === 'workout') renderWorkout();
    else if (currentTab === 'history') renderHistory();
    else if (currentTab === 'progress') renderProgress();
    else if (currentTab === 'body') renderBody();
    else if (currentTab === 'stats') renderStats();
  });
}

function handleOffline() {
  updateSyncDot('offline');
}

window.addEventListener('online', handleOnline);
window.addEventListener('offline', handleOffline);

// Initialize sync state
if (!firebaseConfigured) {
  updateSyncDot('unconfigured');
} else if (!navigator.onLine) {
  updateSyncDot('offline');
} else {
  updateSyncDot('online');
}

// ═══════════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════════
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [0, 0.22, 0.44].forEach(delay => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      osc.type = 'square';
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.15);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 0.15);
    });
  } catch {}
}

// ═══════════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════════
let timerDuration = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerFinished = false;
const CIRCUMFERENCE = 2 * Math.PI * 75;

function startTimer() {
  timerRemaining = timerDuration;
  timerFinished = false;
  updateTimerUI();
  document.getElementById('rest-timer').classList.remove('hidden');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    if (timerRemaining <= 0) {
      timerRemaining = 0;
      timerFinished = true;
      clearInterval(timerInterval);
      playBeep();
      vibrate([200, 100, 200]);
    }
    updateTimerUI();
  }, 1000);
}

function setTimerDuration(d) {
  timerDuration = d;
  timerRemaining = d;
  timerFinished = false;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    if (timerRemaining <= 0) {
      timerRemaining = 0;
      timerFinished = true;
      clearInterval(timerInterval);
      playBeep();
      vibrate([200, 100, 200]);
    }
    updateTimerUI();
  }, 1000);
  updateTimerUI();
}

function updateTimerUI() {
  const pct = timerDuration > 0 ? ((timerDuration - timerRemaining) / timerDuration) * 100 : 100;
  const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
  const ring = document.getElementById('timer-ring');
  ring.style.strokeDasharray = CIRCUMFERENCE;
  ring.style.strokeDashoffset = offset;

  const mins = Math.floor(timerRemaining / 60);
  const secs = timerRemaining % 60;
  document.getElementById('timer-digits').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

  const status = document.getElementById('timer-status');
  const digits = document.getElementById('timer-digits');
  const dismiss = document.getElementById('timer-dismiss');
  const btn60 = document.getElementById('timer-60');
  const btn90 = document.getElementById('timer-90');

  if (timerFinished) {
    status.textContent = 'REST COMPLETE — GO LIFT';
    status.classList.add('done');
    ring.classList.add('done');
    digits.classList.add('done');
    dismiss.classList.add('done');
    dismiss.textContent = "LET'S GO";
  } else {
    status.textContent = 'REST TIMER';
    status.classList.remove('done');
    ring.classList.remove('done');
    digits.classList.remove('done');
    dismiss.classList.remove('done');
    dismiss.textContent = 'SKIP';
  }

  btn60.className = 'timer-toggle' + (timerDuration === 60 ? ' active' : '') + (timerFinished ? ' done' : '');
  btn90.className = 'timer-toggle' + (timerDuration === 90 ? ' active' : '') + (timerFinished ? ' done' : '');
}

function dismissTimer() {
  clearInterval(timerInterval);
  document.getElementById('rest-timer').classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function getBest(entries) {
  if (!entries.length) return null;
  return entries.reduce((b, e) => (e.weight > b.weight || (e.weight === b.weight && e.reps > b.reps)) ? e : b, entries[0]);
}
function getTrend(entries) {
  if (entries.length < 2) return null;
  const s = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
  const rv = s[0].weight * s[0].reps, pv = s[1].weight * s[1].reps;
  return rv > pv ? 'up' : rv < pv ? 'down' : 'flat';
}
function groupByDate(entries) {
  const g = {};
  entries.forEach(e => {
    // Use YYYY-MM-DD as key for reliable sorting
    const k = new Date(e.date).toISOString().slice(0, 10);
    if (!g[k]) g[k] = [];
    g[k].push(e);
  });
  // Sort most recent first, then map key to a friendly label
  return Object.entries(g)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .map(([k, sets]) => {
      const d = new Date(k + 'T12:00:00'); // noon to avoid timezone flipping the day
      const today = new Date();
      const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
      let label;
      if (k === today.toISOString().slice(0, 10)) label = 'Today';
      else if (k === yesterday.toISOString().slice(0, 10)) label = 'Yesterday';
      else label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      return [label, sets];
    });
}

// ═══════════════════════════════════════════════════════════════
// PLATE CALCULATOR
// ═══════════════════════════════════════════════════════════════
const BAR_WEIGHT = 45;
const PLATES = [45, 35, 25, 10, 5, 2.5];

function updatePlateCalc() {
  const el = document.getElementById('plate-calc');
  const input = document.getElementById('input-weight');
  const weight = parseFloat(input.value);

  if (!weight || weight <= 0) {
    el.classList.add('hidden');
    return;
  }

  el.classList.remove('hidden');

  const perSide = (weight - BAR_WEIGHT) / 2;

  document.getElementById('plate-calc-bar').textContent = `Bar: ${BAR_WEIGHT} lbs`;

  if (perSide <= 0) {
    document.getElementById('plate-calc-side').textContent = 'Each side: just the bar';
    document.getElementById('plate-chips').innerHTML = '';
    document.getElementById('plate-calc-note').classList.add('hidden');
    return;
  }

  let remaining = perSide;
  const counts = [];

  for (const plate of PLATES) {
    const count = Math.floor(remaining / plate);
    if (count > 0) {
      counts.push({ plate, count });
      remaining = parseFloat((remaining - count * plate).toFixed(2));
    }
  }

  const actualPerSide = perSide - remaining;
  const actualTotal = BAR_WEIGHT + actualPerSide * 2;

  document.getElementById('plate-calc-side').textContent =
    `Each side: ${actualPerSide} lbs`;

  document.getElementById('plate-chips').innerHTML = counts.map(c =>
    `<span class="plate-chip _${String(c.plate).replace('.', '-')}">${c.plate} × ${c.count}</span>`
  ).join('');

  const note = document.getElementById('plate-calc-note');
  if (remaining > 0 && remaining < 2.5) {
    note.textContent = `Closest achievable: ${actualTotal} lbs (no plates < 2.5)`;
    note.classList.remove('hidden');
  } else if (Math.abs(weight - actualTotal) > 0.01) {
    note.textContent = `Closest achievable: ${actualTotal} lbs`;
    note.classList.remove('hidden');
  } else {
    note.classList.add('hidden');
  }
}

// SUPERSET HELPERS
// ═══════════════════════════════════════════════════════════════
function getSupersetPartner(ex) {
  if (!data.supersets) return null;
  const pair = data.supersets.find(p => p[0] === ex || p[1] === ex);
  if (!pair) return null;
  return pair[0] === ex ? pair[1] : pair[0];
}

function isSuperset(ex) {
  if (!data.supersets) return false;
  return data.supersets.some(p => p[0] === ex || p[1] === ex);
}

function pairSuperset(exA, exB) {
  // Remove any existing pairs involving either exercise
  data.supersets = data.supersets.filter(p => p[0] !== exA && p[1] !== exA && p[0] !== exB && p[1] !== exB);
  data.supersets.push([exA, exB]);
  saveData(data);
}

function unpairSuperset(ex) {
  data.supersets = data.supersets.filter(p => p[0] !== ex && p[1] !== ex);
  saveData(data);
}

function renderWorkout() {
  const el = document.getElementById('view-workout');

  // State 1: Exercise detail view
  if (currentExercise) {
    const ex = currentExercise;
    const entries = data.history.filter(h => h.exercise === ex);
    const grouped = groupByDate(entries);
    const best = getBest(entries);

    let html = `<button class="btn-secondary" style="margin-bottom:16px" onclick="backToList()">‹ Back</button>`;
    html += `<h2 style="font-size:22px;font-weight:800;margin-bottom:4px">${ex}</h2>`;
    html += `<p style="color:var(--text-dim);font-size:12px;margin-bottom:20px">${entries.length} total set${entries.length !== 1 ? 's' : ''}</p>`;

    if (best) {
      html += `<div class="card pr-card">
        <div><div class="pr-label">PERSONAL RECORD</div><div class="pr-value">${best.weight} <span class="pr-unit">lbs</span> × ${best.reps} <span class="pr-unit">reps</span></div></div>
        <div style="font-size:12px;color:var(--text-dim)">${fmtDate(best.date)}</div>
      </div>`;
    }

    html += `<button class="btn-primary" style="margin-bottom:24px" onclick="showModal('log')">＋ LOG SETS</button>`;

    grouped.forEach(([, sets]) => {
      html += `<div style="margin-bottom:20px"><div class="date-header">${fmtDate(sets[0].date)}</div>`;
      sets.forEach(s => {
        const idx = data.history.indexOf(s);
        html += `<div class="history-set" onclick="editEntry(${idx})" style="cursor:pointer">
          <div><span class="set-weight">${s.weight}<span class="set-unit"> lbs</span></span><span class="set-x">×</span><span class="set-weight">${s.reps}<span class="set-unit"> reps</span></span><span class="set-vol">vol: ${s.weight * s.reps}</span></div>
          <div class="flex-center"><span class="set-time">${fmtTime(s.date)}</span><button class="set-delete" onclick="event.stopPropagation();confirmDeleteEntry(${idx})">×</button></div>
        </div>`;
      });
      html += `</div>`;
    });

    if (!entries.length) {
      html += `<div class="empty" style="padding:40px 20px"><p style="color:var(--text-muted);font-size:13px">No sets logged yet. Time to lift.</p></div>`;
    }

    html += `<div class="delete-zone"><button class="btn-danger" onclick="confirmDeleteExercise('${ex.replace(/'/g, "\\'")}')">Delete Exercise</button></div>`;
    el.innerHTML = html;
    return;
  }

  // State 2: Default — exercise list (or setup if empty)
  if (!data.exercises.length) {
    let html = `<div class="setup-title">Quick Setup</div>`;
    html += `<p class="setup-sub">Pick a split to populate your exercise list. You can add or remove exercises anytime.</p>`;

    Object.entries(SPLITS).forEach(([key, split]) => {
      const sel = selectedSplit === key ? ' selected' : '';
      html += `<div class="split-card${sel}" onclick="selectedSplit='${key}';renderWorkout()">
        <div class="split-card-title">${split.label}</div>
        <div class="split-card-sub">${split.sub}</div>
        <div class="split-card-exercises">${split.exercises.map(e => `<span class="split-card-exercise">${e}</span>`).join('')}</div>
      </div>`;
    });

    html += `<button class="btn-primary" style="margin-top:16px" onclick="setupSplit()">Set Up My Exercises</button>`;
    html += `<p style="text-align:center;margin-top:12px;font-size:11px;color:var(--text-muted)">You can also add exercises manually with the + button</p>`;
    el.innerHTML = html;
    return;
  }

  // Day filter pills — always show Upper A/B, Lower A/B
  const dayKeys = Object.keys(DAY_EXERCISES);
  let filterHTML = '<div class="day-filter">';
  dayKeys.forEach(day => {
    const cls = activeDay === day ? ' active' : '';
    filterHTML += `<button class="day-filter-btn${cls}" onclick="event.stopPropagation();activeDay=activeDay==='${day}'?null:'${day}';renderWorkout()">${day}</button>`;
  });
  filterHTML += '</div>';

  // No day selected — show prompt, hide exercise list
  if (!activeDay) {
    el.innerHTML = filterHTML + `<div style="text-align:center;padding:60px 20px;color:var(--text-dim)">
      <div style="font-size:40px;margin-bottom:16px">💪</div>
      <div style="font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px">Ready to train?</div>
      <div style="font-size:13px">Select a workout above to get started</div>
    </div>`;
    return;
  }

  // END WORKOUT button — only show when a day is active
  filterHTML += `<button class="btn-danger" style="width:100%;margin-bottom:16px;padding:14px;font-size:13px;font-weight:800;letter-spacing:1px" onclick="activeDay=null;switchTab('progress')">END WORKOUT</button>`;

  const filteredExercises = activeDay && DAY_EXERCISES[activeDay]
    ? data.exercises.filter(ex => DAY_EXERCISES[activeDay].some(de => de.toLowerCase() === ex.toLowerCase()))
    : data.exercises;

  el.innerHTML = filterHTML + filteredExercises.map(ex => {
    const entries = data.history.filter(h => h.exercise === ex);
    const best = getBest(entries);
    const trend = getTrend(entries);
    const trendHTML = trend ? `<span class="trend-${trend}">${trend === 'up' ? '▲' : trend === 'down' ? '▼' : '─'}</span>` : '';
    const ssBadge = isSuperset(ex) ? `<span class="superset-badge">SS</span>` : '';
    const partner = getSupersetPartner(ex);
    const ssMeta = partner ? `<span style="color:var(--accent);font-size:10px">⟷ ${partner}</span>` : '';

    let progressHTML = '';
    if (best && entries.length >= 2) {
      const latest = entries.reduce((a, b) => new Date(b.date) > new Date(a.date) ? b : a, entries[0]);
      const ratio = Math.min((latest.weight * latest.reps) / (best.weight * best.reps) * 100, 100);
      const cls = ratio >= 90 ? 'good' : ratio >= 70 ? '' : 'warn';
      progressHTML = `<div class="progress-track"><div class="progress-fill ${cls}" style="width:${ratio}%"></div></div>`;
    }

    return `<div class="exercise-item" onclick="openExercise('${ex.replace(/'/g, "\\'")}')">
      <div style="flex:1;min-width:0">
        <div class="exercise-name">${ex}${ssBadge}</div>
        <div class="exercise-meta">${ssMeta ? ssMeta + ' &nbsp;·&nbsp; ' : ''}${entries.length} set${entries.length !== 1 ? 's' : ''} logged${best ? `<span class="exercise-pr">PR: ${best.weight}×${best.reps}</span>` : ''}</div>
        ${progressHTML}
      </div>
      <div class="flex-center">${trendHTML}<span class="chevron">›</span></div>
    </div>`;
  }).join('');
}

logSet = function() {
  const weightInput = document.getElementById('input-weight');
  const repsInput = document.getElementById('input-reps');
  const w = parseFloat(weightInput.value);
  const r = parseInt(repsInput.value);

  if (!w || w <= 0 || !r || r <= 0) return;
  unlockAudio();

  if (editingEntryIndex >= 0 && editingEntryIndex < data.history.length) {
    data.history[editingEntryIndex].weight = w;
    data.history[editingEntryIndex].reps = r;
    data.history[editingEntryIndex].date = new Date().toISOString();
    editingEntryIndex = -1;
  } else {
    data.history.push({ id: genId(), exercise: currentExercise, weight: w, reps: r, date: new Date().toISOString() });
  }
  saveData(data);
  console.log('IronLog logSet: data.history.length =', data.history.length, 'exercise =', currentExercise);
  closeModal('log');

  const partner = getSupersetPartner(currentExercise);
  if (partner && supersetJustLogged !== partner) {
    supersetJustLogged = currentExercise;
    currentExercise = partner;
    setTimeout(() => showModal('log'), 150);

  }

  supersetJustLogged = null;
  if (currentTab === 'workout') renderWorkout();
  else if (currentTab === 'history') renderHistory();
  startTimer();
};

// ═══════════════════════════════════════════════════════════════
// PROGRESS TAB
// ═══════════════════════════════════════════════════════════════
function renderProgress() {
  const el = document.getElementById('view-progress');
  if (!data.exercises.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📈</div><p class="empty-title">No exercises yet</p><p class="empty-sub">Add exercises and log sets to see progress</p></div>`;
    return;
  }
  // Determine exercise BEFORE building HTML so the select's selected
  // option matches the data we query (DOM element may not exist yet on first render)
  const prevSelect = document.getElementById('progress-select');
  const selEx = prevSelect?.value
    || (currentExercise && data.exercises.some(e => e.toLowerCase() === currentExercise.toLowerCase()) ? currentExercise : data.exercises[0]);
  currentExercise = selEx;

  let html = `<h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Progress</h2>
    <select class="superset-select progress-exercise-select" id="progress-select" onchange="renderProgress()">${data.exercises.map(ex => `<option ${selEx.toLowerCase() === ex.toLowerCase() ? 'selected' : ''}>${ex}</option>`).join('')}</select>`;
  const entries = data.history.filter(h => h.exercise === selEx).sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!entries.length) {
    html += `<p style="color:var(--text-muted);text-align:center;padding:20px">No data for ${selEx} yet</p>`;
    el.innerHTML = html;
    return;
  }

  // Weight progression chart
  const W = 340; const H = 170; const pad = { top: 10, right: 20, bottom: 22, left: 38 };
  const pw = W - pad.left - pad.right; const ph = H - pad.top - pad.bottom;
  const maxW = Math.max(...entries.map(e => e.weight));
  const minW = Math.min(...entries.map(e => e.weight));
  const range = maxW - minW || 10;
  const pts = entries.map((e, i) => ({
    x: pad.left + (entries.length > 1 ? (i / (entries.length - 1)) * pw : pw / 2),
    y: pad.top + ph - ((e.weight - minW + range * 0.1) / (range * 1.2)) * ph,
    w: e.weight, r: e.reps, d: fmtDate(e.date)
  }));

  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" class="chart-dot"><title>${p.w}×${p.r} — ${p.d}</title></circle>`).join('');

  // Grid lines
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const y = pad.top + (ph / 3) * i;
    const val = maxW + range * 0.1 - (range * 1.2 / 3) * i;
    grid += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left + pw}" y2="${y.toFixed(1)}" class="chart-grid"/>`;
    grid += `<text x="${pad.left - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end" class="chart-label">${val.toFixed(0)}</text>`;
  }

  html += `<div class="chart-container"><div class="chart-title">Weight Progression — ${selEx}</div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}"><path d="${linePath}" class="chart-line"/>${dots}${grid}</svg>
    <div class="trend-summary">
      <div class="trend-stat"><div class="trend-stat-value">${maxW}</div><div class="trend-stat-label">Max Weight</div></div>
      <div class="trend-stat"><div class="trend-stat-value">${entries.length}</div><div class="trend-stat-label">Total Sets</div></div>
      <div class="trend-stat"><div class="trend-stat-value">${(entries.reduce((s, e) => s + e.weight * e.reps, 0) / 1000).toFixed(1)}k</div><div class="trend-stat-label">Volume</div></div>
    </div>
  </div>`;

  // Recent history
  const recent = [...entries].reverse().slice(0, 8);
  html += `<div class="card"><div class="chart-title">Recent Sets</div>`;
  recent.forEach(e => {
    html += `<div class="history-set"><div><span class="set-weight">${e.weight}<span class="set-unit"> lbs</span></span><span class="set-x">×</span><span class="set-weight">${e.reps}<span class="set-unit"> reps</span></span></div><span class="set-time">${fmtDate(e.date)}</span></div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// BODY TAB
// ═══════════════════════════════════════════════════════════════
function renderBody() {
  const el = document.getElementById('view-body');
  const metrics = data.bodyMetrics || [];
  const sorted = [...metrics].sort((a, b) => new Date(b.date) - new Date(a.date));

  let html = `<h2 style="font-size:20px;font-weight:800;margin-bottom:16px">Body</h2>`;

  // Log entry form
  html += `<div class="body-log-row">
    <input class="input" id="body-weight-input" type="number" inputmode="decimal" placeholder="Body weight (lbs)" style="flex:2">
    <button class="btn-primary" style="flex:1;padding:12px" onclick="logBodyWeight()">LOG</button>
  </div>`;

  // Weight chart
  if (sorted.length >= 2) {
    const chartEntries = [...sorted].reverse();
    const W = 340; const H = 150; const pad = { top: 10, right: 20, bottom: 22, left: 38 };
    const pw = W - pad.left - pad.right; const ph = H - pad.top - pad.bottom;
    const maxWt = Math.max(...chartEntries.map(e => e.weight));
    const minWt = Math.min(...chartEntries.map(e => e.weight));
    const range = maxWt - minWt || 5;
    const pts = chartEntries.map((e, i) => ({
      x: pad.left + (chartEntries.length > 1 ? (i / (chartEntries.length - 1)) * pw : pw / 2),
      y: pad.top + ph - ((e.weight - minWt + range * 0.15) / (range * 1.3)) * ph,
      w: e.weight, d: fmtDate(e.date)
    }));
    const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" class="chart-dot"><title>${p.w} lbs — ${p.d}</title></circle>`).join('');

    html += `<div class="chart-container"><div class="chart-title">Body Weight Trend</div>
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}"><path d="${linePath}" class="chart-line"/>${dots}</svg>
      <div class="trend-summary">
        <div class="trend-stat"><div class="trend-stat-value">${sorted[0].weight}</div><div class="trend-stat-label">Current (lbs)</div></div>`;

    if (sorted.length >= 2) {
      const diff = sorted[0].weight - sorted[1].weight;
      const diffClass = diff > 0 ? 'up' : 'down';
      html += `<div class="trend-stat"><div class="trend-stat-value body-change ${diffClass}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</div><div class="trend-stat-label">Since Last</div></div>`;
    }

    const first = sorted[sorted.length - 1];
    const totalDiff = sorted[0].weight - first.weight;
    html += `<div class="trend-stat"><div class="trend-stat-value body-change ${totalDiff > 0 ? 'up' : 'down'}">${totalDiff > 0 ? '+' : ''}${totalDiff.toFixed(1)}</div><div class="trend-stat-label">All Time</div></div>`;
    html += `</div></div>`;
  } else if (sorted.length === 1) {
    html += `<div class="card" style="text-align:center"><div style="font-size:28px;font-weight:800">${sorted[0].weight}<span style="font-size:16px;color:var(--text-dim)"> lbs</span></div><div style="font-size:11px;color:var(--text-dim);margin-top:4px">${fmtDate(sorted[0].date)}</div></div>`;
  }

  // History
  if (sorted.length) {
    html += `<div class="chart-title" style="margin-top:20px;margin-bottom:10px">History</div>`;
    sorted.forEach(e => {
      const prev = sorted[sorted.indexOf(e) + 1];
      const diff = prev ? e.weight - prev.weight : 0;
      const diffHTML = diff ? `<span class="body-change ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</span>` : '';
      html += `<div class="body-history-item"><div><span class="body-weight">${e.weight}<span class="body-weight-unit"> lbs</span></span> ${diffHTML}</div><div class="flex-center"><span class="set-time">${fmtDate(e.date)}</span><button class="set-delete" onclick="deleteBodyMetric('${e.id}')">×</button></div></div>`;
    });
  } else {
    html += `<p style="color:var(--text-muted);text-align:center;padding:20px">No body weight logged yet</p>`;
  }

  el.innerHTML = html;
}

function logBodyWeight() {
  const input = document.getElementById('body-weight-input');
  const w = parseFloat(input.value);
  if (!w || w <= 0) return;
  if (!data.bodyMetrics) data.bodyMetrics = [];
  data.bodyMetrics.push({ id: genId(), weight: w, date: new Date().toISOString() });
  saveData(data);
  input.value = '';
  renderBody();
}

function deleteBodyMetric(id) {
  if (!data.bodyMetrics) return;
  data.bodyMetrics = data.bodyMetrics.filter(e => e.id !== id);
  saveData(data);
  renderBody();
}

// ═══════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════
function addExercise() {
  const input = document.getElementById('input-exercise-name');
  const name = input.value.trim();
  if (!name) return;
  if (data.exercises.some(e => e.toLowerCase() === name.toLowerCase())) {
    alert('Exercise already exists!');
    return;
  }
  data.exercises.push(name);
  data.exercises.sort((a, b) => a.localeCompare(b));
  console.log('IronLog addExercise: added', name, 'total exercises now', data.exercises.length);
  saveData(data);
  input.value = '';
  closeModal('add');
  if (currentTab === 'workout') renderWorkout();
  else if (currentTab === 'history') renderHistory();
  else if (currentTab === 'progress') renderProgress();
}


function confirmDeleteExercise(name) {
  pendingConfirm = { type: 'exercise', name };
  document.getElementById('confirm-title').textContent = `Delete ${name}?`;
  document.getElementById('confirm-message').textContent = 'This will remove the exercise and ALL its history. This can\'t be undone.';
  showModal('confirm');
}

function editEntry(idx) {
  editingEntryIndex = idx;
  const entry = data.history[idx];
  currentExercise = entry.exercise;
  showModal('log');
}

function confirmDeleteEntry(idx) {
  pendingConfirm = { type: 'entry', idx };
  document.getElementById('confirm-title').textContent = 'Delete this set?';
  document.getElementById('confirm-message').textContent = 'This entry will be permanently removed.';
  showModal('confirm');
}

function confirmAction() {
  if (!pendingConfirm) return;
  if (pendingConfirm.type === 'exercise') {
    data.exercises = data.exercises.filter(e => e !== pendingConfirm.name);
    data.history = data.history.filter(h => h.exercise !== pendingConfirm.name);
    unpairSuperset(pendingConfirm.name);
    saveData(data);
    closeModal('confirm');
    backToList();
  } else if (pendingConfirm.type === 'entry') {
    data.history.splice(pendingConfirm.idx, 1);
    saveData(data);
    closeModal('confirm');
    if (currentTab === 'workout') renderWorkout();
    else if (currentTab === 'history') renderHistory();
  }
  pendingConfirm = null;
}

// ═══════════════════════════════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════════════════════════════
function exportCSV() {
  const rows = [['Exercise', 'Weight (lbs)', 'Reps', 'Date', 'Volume']];
  [...data.history].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(h => {
    rows.push([h.exercise, h.weight, h.reps, new Date(h.date).toLocaleDateString(), h.weight * h.reps]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'iron-log-workouts.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════════
function showModal(type) {
  const id = 'modal-' + type;
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  attachSwipeToDismiss(el, () => closeModal(type));
  if (type === 'add') {
    setTimeout(() => document.getElementById('input-exercise-name').focus(), 100);
  } else if (type === 'log') {
    document.getElementById('log-modal-title').textContent = currentExercise;
    document.getElementById('log-single-set').classList.remove('hidden');
    document.getElementById('log-multi-set').classList.add('hidden');
    document.getElementById('plate-calc').classList.add('hidden');

    if (editingEntryIndex >= 0 && editingEntryIndex < data.history.length) {
      const entry = data.history[editingEntryIndex];
      document.getElementById('log-modal-subtitle').textContent = 'Edit set';
      document.getElementById('log-set-btn').textContent = 'UPDATE SET';
      document.getElementById('input-weight').value = entry.weight || '';
      document.getElementById('input-reps').value = entry.reps || '';
      updatePlateCalc();
      setTimeout(() => document.getElementById('input-weight').focus(), 100);
    } else {
      document.getElementById('log-modal-subtitle').textContent = 'Log set';
      document.getElementById('log-set-btn').textContent = 'LOG SET';
      document.getElementById('input-weight').value = '';
      document.getElementById('input-reps').value = '';
      editingEntryIndex = -1;
      updatePlateCalc();
      setTimeout(() => document.getElementById('input-weight').focus(), 100);
    }
  }
}

function closeModal(type) {
  document.getElementById('modal-' + type).classList.add('hidden');
  if (type === 'log') {
    supersetJustLogged = null;
    editingEntryIndex = -1;
  }
}

function attachSwipeToDismiss(overlay, onDismiss) {
  let startY = 0;
  let startTime = 0;
  const modalOpenTime = Date.now();
  const content = overlay.querySelector('.modal-content');
  if (!content) return;

  function onTouchStart(e) {
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }

  function onTouchEnd(e) {
    if (e.target.closest('input') || e.target.closest('button')) return;
    if (Date.now() - startTime < 150) return;
    if (Date.now() - modalOpenTime < 500) return;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 120 && content.scrollTop <= 0) {
      onDismiss();
    }
  }

  content.removeEventListener('touchstart', onTouchStart);
  content.addEventListener('touchstart', onTouchStart, { passive: true });
  content.removeEventListener('touchend', onTouchEnd);
  content.addEventListener('touchend', onTouchEnd);
}

// ═══════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════
function getTheme() {
  return localStorage.getItem('ironlog-theme') || 'dark';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = theme === 'light' ? '🌙' : '☀️';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = theme === 'light' ? '#f5f5f5' : '#0a0a0a';
  localStorage.setItem('ironlog-theme', theme);
}

function toggleTheme() {
  const current = getTheme();
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function dismissSkeleton() {
  const skel = document.getElementById('skeleton-screen');

}
